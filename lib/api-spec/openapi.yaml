openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: foundation
    description: Phase 1 module availability
  - name: authentication
    description: Account registration, login, and session management
  - name: financial-profile
    description: The signed-in user's financial profile
  - name: transactions
    description: Account-owned income and expense records
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [authentication]
      summary: Get the current user's session
      responses:
        "200":
          description: Current session, or an unauthenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/register:
    post:
      operationId: registerUser
      tags: [authentication]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsInput"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid registration fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Account could not be created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      operationId: loginUser
      tags: [authentication]
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsInput"
      responses:
        "200":
          description: Signed-in session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid login fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logoutUser
      tags: [authentication]
      summary: Sign out and invalidate the current session
      responses:
        "204":
          description: Session ended
  /profile:
    get:
      operationId: getFinancialProfile
      tags: [financial-profile]
      summary: Get the signed-in user's financial profile
      responses:
        "200":
          description: Financial profile, or null when not created yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialProfileEnvelope"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateFinancialProfile
      tags: [financial-profile]
      summary: Create or update the signed-in user's financial profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinancialProfileInput"
      responses:
        "200":
          description: Saved financial profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialProfileEnvelope"
        "400":
          description: Invalid financial profile fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /profile/status:
    get:
      operationId: getProfileModuleStatus
      tags: [foundation]
      summary: Profile module availability
      responses:
        "200":
          description: Phase 1 module availability status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileModuleStatus"
  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List the signed-in user's transactions
      parameters:
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/TransactionType"
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/TransactionCategory"
        - name: fromDate
          in: query
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          schema:
            type: string
            format: date
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [transactionDate, amount, category, createdAt]
            default: transactionDate
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [ASC, DESC]
            default: DESC
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paged transaction results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionList"
        "400":
          description: Invalid transaction filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Add a transaction for the signed-in user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionEnvelope"
        "400":
          description: Invalid transaction fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /transactions/summary:
    get:
      operationId: getTransactionSummary
      tags: [transactions]
      summary: Calculate transaction totals and monthly trends
      responses:
        "200":
          description: Deterministic totals computed from stored transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionSummary"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /transactions/{transactionId}:
    put:
      operationId: updateTransaction
      tags: [transactions]
      summary: Update one of the signed-in user's transactions
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "200":
          description: Transaction updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionEnvelope"
        "400":
          description: Invalid transaction fields or ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteTransaction
      tags: [transactions]
      summary: Delete one of the signed-in user's transactions
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Transaction deleted
        "400":
          description: Invalid transaction ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /transactions/import/preview:
    post:
      operationId: previewTransactionCsv
      tags: [transactions]
      summary: Validate and preview a CSV before importing it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionCsvInput"
      responses:
        "200":
          description: Parsed rows with row-level validation results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionCsvPreview"
        "400":
          description: Invalid CSV file or columns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /transactions/import:
    post:
      operationId: importTransactionCsv
      tags: [transactions]
      summary: Import a validated CSV as one atomic operation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionCsvInput"
      responses:
        "200":
          description: All valid rows imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionCsvResult"
        "400":
          description: Invalid CSV file or columns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Import rejected because the CSV contains invalid rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionCsvPreview"
  /analytics:
    get:
      operationId: getAnalyticsStatus
      tags: [foundation]
      summary: Analytics module status
      responses:
        "200":
          description: Phase 1 availability status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsModuleStatus"
  /analytics/summary:
    get:
      operationId: getAnalyticsSummary
      tags: [analytics]
      summary: Overall and current month financial summary
      responses:
        "200":
          description: Calculated summary metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummary"
  /analytics/monthly:
    get:
      operationId: getAnalyticsMonthlyTrend
      tags: [analytics]
      summary: Monthly trend metrics for income, expenses, and savings
      responses:
        "200":
          description: Monthly trend history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsMonthlyTrend"
  /analytics/categories:
    get:
      operationId: getAnalyticsCategoryBreakdown
      tags: [analytics]
      summary: Category expense breakdown and percentages
      responses:
        "200":
          description: Expense categories breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsCategoryBreakdown"
  /analytics/recurring:
    get:
      operationId: getAnalyticsRecurringSummary
      tags: [analytics]
      summary: Recurring income and expense transactions
      responses:
        "200":
          description: Recurring items and metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsRecurringSummary"
  /analytics/financial-health:
    get:
      operationId: getAnalyticsFinancialHealth
      tags: [analytics]
      summary: Transparent financial health metrics and indicators
      responses:
        "200":
          description: Financial health indicators
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsFinancialHealth"
  /goals/status:
    get:
      operationId: getGoalsStatus
      tags: [foundation]
      summary: Goals module status
      responses:
        "200":
          description: Phase 1 availability status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalsModuleStatus"
  /goals/list:
    get:
      operationId: getGoals
      tags: [goals]
      summary: List user financial goals with calculated metrics
      responses:
        "200":
          description: List of financial goals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialGoalsListResponse"
  /goals:
    post:
      operationId: createGoal
      tags: [goals]
      summary: Create a financial goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "201":
          description: Goal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialGoal"
  /goals/{goalId}:
    get:
      operationId: getGoal
      tags: [goals]
      summary: Get goal details and contributions
      parameters:
        - name: goalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Goal detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialGoalDetail"
    put:
      operationId: updateGoal
      tags: [goals]
      summary: Update a financial goal
      parameters:
        - name: goalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "200":
          description: Goal updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialGoal"
    delete:
      operationId: deleteGoal
      tags: [goals]
      summary: Delete a goal
      parameters:
        - name: goalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Goal deleted
  /goals/{goalId}/contributions:
    post:
      operationId: addGoalContribution
      tags: [goals]
      summary: Add a contribution to a goal
      parameters:
        - name: goalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalContributionInput"
      responses:
        "201":
          description: Contribution added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialGoalDetail"
  /simulator:
    get:
      operationId: getSimulatorStatus
      tags: [foundation]
      summary: Simulator module status
      responses:
        "200":
          description: Phase 1 availability status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulatorModuleStatus"
  /simulator/run:
    post:
      operationId: runSimulation
      tags: [simulator]
      summary: Run deterministic what-if financial scenario simulation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulatorInput"
      responses:
        "200":
          description: Simulation comparison results and projected monthly timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulatorResult"
  /assistant:
    get:
      operationId: getAssistantStatus
      tags: [foundation]
      summary: Assistant module status
      responses:
        "200":
          description: Phase 1 availability status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantModuleStatus"
  /assistant/chat:
    post:
      operationId: askAssistantChat
      tags: [assistant]
      summary: Ask AI financial planning assistant for verified explanations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInput"
      responses:
        "200":
          description: AI explanation based on verified backend context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ProfileModuleStatus:
      allOf:
        - $ref: "#/components/schemas/ModuleStatus"
        - type: object
          properties:
            module:
              const: profile
          required: [module]
    TransactionsModuleStatus:
      allOf:
        - $ref: "#/components/schemas/ModuleStatus"
        - type: object
          properties:
            module:
              const: transactions
          required: [module]
    AnalyticsModuleStatus:
      allOf:
        - $ref: "#/components/schemas/ModuleStatus"
        - type: object
          properties:
            module:
              const: analytics
          required: [module]
    GoalsModuleStatus:
      allOf:
        - $ref: "#/components/schemas/ModuleStatus"
        - type: object
          properties:
            module:
              const: goals
          required: [module]
    SimulatorModuleStatus:
      allOf:
        - $ref: "#/components/schemas/ModuleStatus"
        - type: object
          properties:
            module:
              const: simulator
          required: [module]
    AssistantModuleStatus:
      allOf:
        - $ref: "#/components/schemas/ModuleStatus"
        - type: object
          properties:
            module:
              const: assistant
          required: [module]
    CredentialsInput:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 12
          maxLength: 128
      required: [email, password]
    SessionUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: [string, "null"]
          maxLength: 120
        hasFinancialProfile:
          type: boolean
      required: [id, email, displayName, hasFinancialProfile]
    AuthSession:
      type: object
      properties:
        authenticated:
          type: boolean
        user:
          oneOf:
            - $ref: "#/components/schemas/SessionUser"
            - type: "null"
      required: [authenticated, user]
    FinancialProfileInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        ageRange:
          type: string
          enum: ["18-24", "25-34", "35-44", "45-54", "55-64", "65+"]
        employmentStatus:
          type: string
          enum: [employed, self_employed, unemployed, student, retired, other]
        currencyCode:
          type: string
          pattern: "^[A-Z]{3}$"
        monthlyIncome:
          type: number
          minimum: 0
          maximum: 100000000
        existingSavings:
          type: number
          minimum: 0
          maximum: 999999999999.99
        monthlyFixedExpenses:
          type: number
          minimum: 0
          maximum: 100000000
        monthlyVariableExpenses:
          type: number
          minimum: 0
          maximum: 100000000
        monthlyLoanPayments:
          type: number
          description: Monthly payments for existing loans or EMIs; use zero when there are none.
          minimum: 0
          maximum: 100000000
        emergencyFundAmount:
          type: number
          minimum: 0
          maximum: 999999999999.99
        primaryGoal:
          type: string
          enum:
            - emergency_fund
            - debt_repayment
            - home_purchase
            - education
            - retirement
            - long_term_savings
            - other
        planningHorizon:
          type: string
          enum: [under_1_year, 1_to_3_years, 3_to_5_years, 5_plus_years]
      required:
        - name
        - ageRange
        - employmentStatus
        - currencyCode
        - monthlyIncome
        - existingSavings
        - monthlyFixedExpenses
        - monthlyVariableExpenses
        - monthlyLoanPayments
        - emergencyFundAmount
        - primaryGoal
        - planningHorizon
    FinancialProfile:
      allOf:
        - $ref: "#/components/schemas/FinancialProfileInput"
        - type: object
          properties:
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
          required: [createdAt, updatedAt]
    FinancialProfileEnvelope:
      type: object
      properties:
        profile:
          oneOf:
            - $ref: "#/components/schemas/FinancialProfile"
            - type: "null"
      required: [profile]
    TransactionType:
      type: string
      enum: [INCOME, EXPENSE]
    TransactionCategory:
      type: string
      enum:
        - Salary
        - Freelance
        - Business
        - Housing
        - Food
        - Transport
        - Healthcare
        - Education
        - Shopping
        - Entertainment
        - Utilities
        - EMI/Loans
        - Subscriptions
        - Other
    TransactionInput:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/TransactionType"
        amount:
          type: number
          minimum: 0.01
          maximum: 999999999999.99
        category:
          $ref: "#/components/schemas/TransactionCategory"
        description:
          type: string
          maxLength: 500
        transactionDate:
          type: string
          format: date
        recurring:
          type: boolean
          default: false
      required: [type, amount, category, transactionDate]
    Transaction:
      allOf:
        - $ref: "#/components/schemas/TransactionInput"
        - type: object
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
          required: [id, createdAt, updatedAt]
    TransactionEnvelope:
      type: object
      properties:
        transaction:
          $ref: "#/components/schemas/Transaction"
      required: [transaction]
    TransactionList:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
      required: [transactions, page, pageSize, total, totalPages]
    TransactionMonthSummary:
      type: object
      properties:
        month:
          type: string
          pattern: "^\\d{4}-\\d{2}$"
        income:
          type: number
        expenses:
          type: number
        netCashFlow:
          type: number
      required: [month, income, expenses, netCashFlow]
    TransactionCategoryTotal:
      type: object
      properties:
        category:
          $ref: "#/components/schemas/TransactionCategory"
        amount:
          type: number
      required: [category, amount]
    TransactionSummary:
      type: object
      properties:
        currencyCode:
          type: [string, "null"]
        asOfDate:
          type: string
          format: date
        currentMonth:
          type: string
          pattern: "^\\d{4}-\\d{2}$"
        totalIncome:
          type: number
        totalExpenses:
          type: number
        netCashFlow:
          type: number
        currentMonthIncome:
          type: number
        currentMonthExpenses:
          type: number
        currentMonthNetCashFlow:
          type: number
        monthlyTrend:
          type: array
          items:
            $ref: "#/components/schemas/TransactionMonthSummary"
        currentMonthExpenseByCategory:
          type: array
          items:
            $ref: "#/components/schemas/TransactionCategoryTotal"
      required:
        - currencyCode
        - asOfDate
        - currentMonth
        - totalIncome
        - totalExpenses
        - netCashFlow
        - currentMonthIncome
        - currentMonthExpenses
        - currentMonthNetCashFlow
        - monthlyTrend
        - currentMonthExpenseByCategory
    TransactionCsvInput:
      type: object
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        mimeType:
          type: string
          maxLength: 128
        csvText:
          type: string
          minLength: 1
          maxLength: 1000000
      required: [fileName, csvText]
    TransactionCsvValidRow:
      type: object
      properties:
        rowNumber:
          type: integer
        transaction:
          $ref: "#/components/schemas/TransactionInput"
      required: [rowNumber, transaction]
    TransactionCsvInvalidRow:
      type: object
      properties:
        rowNumber:
          type: integer
        errors:
          type: array
          items:
            type: string
      required: [rowNumber, errors]
    TransactionCsvPreview:
      type: object
      properties:
        totalRows:
          type: integer
        acceptedRows:
          type: integer
        rejectedRows:
          type: integer
        canImport:
          type: boolean
        validRows:
          type: array
          items:
            $ref: "#/components/schemas/TransactionCsvValidRow"
        invalidRows:
          type: array
          items:
            $ref: "#/components/schemas/TransactionCsvInvalidRow"
